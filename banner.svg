<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Slop Dungeon: code review as a text adventure">
  <title>Slop Dungeon</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1326"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <pattern id="bricks" width="64" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0.5H64M0 16.5H64M32 0V16M0 16V32M64 16V32" fill="none" stroke="#1d2645" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#e0782a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e0782a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.35" cy="0.55" r="0.85">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="doorDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#e0862e"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.45" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#e0541e"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <g id="arch">
      <path d="M0 180V60A60 60 0 0 1 120 60V180" fill="#2c3350" stroke="#4a5372" stroke-width="2"/>
      <path d="M12 180V62A48 48 0 0 1 108 62V180Z" fill="url(#doorDark)"/>
      <path d="M52 2h16l-2 14h-12z" fill="#454d6a"/>
    </g>
    <style>
      .title { font-family: "Courier New", Courier, monospace; font-weight: 900; font-size: 74px; letter-spacing: 3px; }
      .sub { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 25px; fill: #cdbb98; }
      .term { font-family: "Courier New", Courier, monospace; font-size: 21px; }
      .numeral { font-family: Georgia, serif; font-size: 15px; fill: #8a90a8; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- stone wall -->
  <rect width="1200" height="300" fill="url(#wall)"/>
  <rect width="1200" height="300" fill="url(#bricks)" opacity="0.8"/>

  <!-- candle glow -->
  <ellipse cx="72" cy="180" rx="380" ry="260" fill="url(#glow)"/>

  <!-- floor -->
  <rect y="280" width="1200" height="20" fill="#06080f"/>
  <path d="M0 280.5H1200" stroke="#262d45" stroke-width="1"/>

  <!-- candle -->
  <g>
    <ellipse cx="72" cy="279" rx="30" ry="5" fill="#2b2118"/>
    <rect x="58" y="206" width="28" height="73" rx="3" fill="#e8dcc0"/>
    <rect x="58" y="206" width="9" height="73" fill="#fff6df" opacity="0.6"/>
    <path d="M58 210q4 10 0 22M86 212q-3 7 0 14" stroke="#d6c7a4" stroke-width="3" fill="none"/>
    <path d="M72 206v-8" stroke="#2a1d12" stroke-width="2"/>
    <ellipse cx="72" cy="186" rx="14" ry="22" fill="#ffb347" opacity="0.35" filter="url(#soft)"/>
    <path d="M72 168c7 9 10 15 10 21a10 10 0 0 1-20 0c0-6 3-12 10-21z" fill="url(#flame)">
      <animate attributeName="opacity" values="1;0.85;1;0.92;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <text x="134" y="124" class="title" fill="#4a160c">SLOP DUNGEON</text>
  <text x="130" y="120" class="title" fill="url(#titleFill)">SLOP DUNGEON</text>
  <text x="132" y="164" class="sub">code review as a text adventure</text>

  <!-- terminal lines -->
  <text x="132" y="220" class="term" fill="#3f9a52">A slop goblin blocks the corridor.</text>
  <text x="132" y="252" class="term" fill="#5cff7a">&gt; fight</text>
  <rect x="228" y="236" width="12" height="20" fill="#5cff7a">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- four wings -->
  <use xlink:href="#arch" href="#arch" transform="translate(735 127) scale(0.85)"/>
  <use xlink:href="#arch" href="#arch" transform="translate(851 127) scale(0.85)"/>
  <use xlink:href="#arch" href="#arch" transform="translate(967 127) scale(0.85)"/>
  <use xlink:href="#arch" href="#arch" transform="translate(1083 127) scale(0.85)"/>
  <text x="786" y="120" class="numeral" text-anchor="middle">I</text>
  <text x="902" y="120" class="numeral" text-anchor="middle">II</text>
  <text x="1018" y="120" class="numeral" text-anchor="middle">III</text>
  <text x="1134" y="120" class="numeral" text-anchor="middle">IV</text>

  <!-- wing I: skull -->
  <g transform="translate(-34 0)">
  <g fill="#d8cdb5" opacity="0.85">
    <circle cx="820" cy="258" r="13"/>
    <rect x="812" y="263" width="16" height="11" rx="2"/>
  </g>
  <g fill="#0a0912">
    <circle cx="815" cy="257" r="3.6"/>
    <circle cx="825" cy="257" r="3.6"/>
    <path d="M820 262l-2 4h4z"/>
    <path d="M816 268v6M820 268v6M824 268v6" stroke="#0a0912" stroke-width="1.2"/>
  </g>

  </g>

  <!-- wing II: monster -->
  <g transform="translate(-58 0)">
  <path d="M922 280c2-40 10-78 38-90 28 12 36 50 38 90l-9-8-8 8-8-8-8 8-8-8-8 8-8-8z" fill="#171328"/>
  <path d="M946 168l6 22M974 168l-6 22" stroke="#171328" stroke-width="6" stroke-linecap="round"/>
  <g fill="#ff3b2f">
    <ellipse cx="950" cy="210" rx="5" ry="3.5"/>
    <ellipse cx="970" cy="210" rx="5" ry="3.5"/>
  </g>
  <g fill="#ff3b2f" opacity="0.6" filter="url(#soft)">
    <ellipse cx="950" cy="210" rx="7" ry="5"/>
    <ellipse cx="970" cy="210" rx="7" ry="5"/>
  </g>
  <path d="M948 226l4 5 4-5 4 5 4-5 4 5 4-5" fill="none" stroke="#5a5470" stroke-width="1.5"/>

  </g>

  <!-- wing III: stairs down -->
  <path transform="translate(-82 0)" d="M1066 280h68v-10h-12v-10h-12v-10h-12v-10h-12" fill="none" stroke="#1b1a2c" stroke-width="2"/>

  <!-- cat, in front of wing IV -->
  <g transform="translate(1144 280)">
    <path d="M-10 0c-14 0-18-14-14-28 3-10 8-16 8-24l-4-12 8 6h8l8-6-4 12c0 8 5 14 8 24 4 14 0 28-14 28z" fill="#020306" stroke="#6a5236" stroke-width="1.2"/>
    <path d="M4 -2c12 0 22-4 20-18" fill="none" stroke="#020306" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-14" cy="-52" r="1.8" fill="#c8e05a"/>
    <circle cx="-6" cy="-52" r="1.8" fill="#c8e05a"/>
  </g>

  <rect width="1200" height="300" fill="url(#vignette)"/>
</svg>
